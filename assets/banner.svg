<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg-grad)" rx="16"/>

  <!-- Animated Dynamic Background Grid & Nodes -->
  <g opacity="0.25">
    <circle cx="150" cy="50" r="3" fill="#38bdf8">
      <animate attributeName="r" values="3;9;3" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="170" r="4" fill="#c084fc">
      <animate attributeName="r" values="4;10;4" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <line x1="150" y1="50" x2="300" y2="180" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="40" x2="1050" y2="170" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="900" cy="40" r="5" fill="#38bdf8">
      <animate attributeName="r" values="5;12;5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <text x="600" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="url(#text-grad)" filter="url(#glow)">
      Awesome Model Context Protocol (MCP) Platform
    </text>
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      ⚡ Curated Ecosystem of MCP Platforms, Tool Registries, Hosted Servers &amp; Open-Source Projects ⚡
    </text>
  </g>
</svg>
